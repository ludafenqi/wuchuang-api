name: WuCora published digest verification (no deployment)
on:
  push:
    branches: [codex/wucora-ghcr-verify-stable-20261119]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: wucora-ghcr-pull-stable
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'ludafenqi/wuchuang-api' && github.ref == 'refs/heads/codex/wucora-ghcr-verify-stable-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
      PRODUCT_SHA: 1a8604f751cab76c8e2de6918c3e5a4905fce252
      PRODUCT_TREE: 9c718221ebcd3486f8ea0155c270262cb952acf4
      REGISTRY_DIGEST: sha256:f0813eeb7858066fff5689355c1fbb4de1794fedc5cbd1f04c5bd49eb508bfa1
      IMAGE: ghcr.io/ludafenqi/wuchuang-api@sha256:f0813eeb7858066fff5689355c1fbb4de1794fedc5cbd1f04c5bd49eb508bfa1
    steps:
      - name: Checkout verification workflow source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Checkout exact product commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 1a8604f751cab76c8e2de6918c3e5a4905fce252
          path: product
          persist-credentials: false
      - name: Record clean product reference and exact Git trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-evidence"
          test "$(git -C automation rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C product rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test -z "$(git -C product status --porcelain --untracked-files=all --ignored)"
          test ! -e product/web/node_modules
          test ! -e product/web/dist
          test ! -e product/.local-tests
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/image-evidence/workflow-sha.txt"
          printf '%s\n' "$PRODUCT_SHA" > "$RUNNER_TEMP/image-evidence/product-sha.txt"
          git -C automation rev-parse HEAD^{tree} > "$RUNNER_TEMP/image-evidence/workflow-tree.txt"
          git -C product rev-parse HEAD^{tree} > "$RUNNER_TEMP/image-evidence/product-tree.txt"
          git -C product ls-files -s > "$RUNNER_TEMP/image-evidence/product-index.txt"
          git -C product status --porcelain --untracked-files=all --ignored > "$RUNNER_TEMP/image-evidence/product-reference-status.txt"
          cp product/Dockerfile "$RUNNER_TEMP/image-evidence/"
          cp product/.dockerignore "$RUNNER_TEMP/image-evidence/dockerignore.txt"
          docker version > "$RUNNER_TEMP/image-evidence/docker-version.txt"
      - name: Login for read-only GHCR pull
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable registry content and pull without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 automation/.github/scripts/registry-fetch.py
          docker pull --platform linux/amd64 "$IMAGE" > "$RUNNER_TEMP/image-evidence/registry-pull.log"
          docker pull --platform linux/amd64 ghcr.io/ludafenqi/wuchuang-api:stable > "$RUNNER_TEMP/image-evidence/stable-pull.log"
          test "$(docker image inspect -f '{{.Id}}' "$IMAGE")" = "$(docker image inspect -f '{{.Id}}' ghcr.io/ludafenqi/wuchuang-api:stable)"
      - name: Inspect packaged image, verify Git-blob licenses and start isolated containers
        shell: bash
        run: bash automation/.github/scripts/image-preparation.sh start
      - name: Set up Bun for the external browser harness
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Verify packaged service, actual relay bindings and embedded pages
        shell: bash
        env:
          UI_BROWSER: /opt/google/chrome/chrome
        run: |
          set -euo pipefail
          test -z "$(git -C product status --porcelain --untracked-files=all --ignored)"
          cd product/web
          bun install --frozen-lockfile
          bun x playwright install-deps chromium
          mkdir -p "$RUNNER_TEMP/image-harness"
          cp ../../automation/.github/scripts/container-browser.mjs "$RUNNER_TEMP/image-harness/"
          ln -s "$GITHUB_WORKSPACE/product/web/node_modules" "$RUNNER_TEMP/image-harness/node_modules"
          "$UI_BROWSER" --version | tee "$RUNNER_TEMP/image-evidence/browser-version.txt"
          UI_REPORT_DIR="$RUNNER_TEMP/image-evidence/browser" bun "$RUNNER_TEMP/image-harness/container-browser.mjs"
          node ../../automation/.github/scripts/image-http.mjs
          cp ../../automation/.github/scripts/container-brand-browser.mjs "$RUNNER_TEMP/image-harness/"
          export BRAND_FIXTURE_HOST="$(docker network inspect -f '{{(index .IPAM.Config 0).Gateway}}' wucora-image-review)"
          UI_REPORT_DIR="$RUNNER_TEMP/image-evidence/brand" bun "$RUNNER_TEMP/image-harness/container-brand-browser.mjs"
          test -z "$(git status --porcelain --untracked-files=all)"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/image-evidence/product-status-after-validation.txt"
      - name: Preserve sanitized logs and verify cleanup
        if: always()
        shell: bash
        run: bash automation/.github/scripts/image-preparation.sh finish
      - name: Upload validation evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ghcr-pull-1a8604f751cab76c8e2de6918c3e5a4905fce252-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/image-evidence/*.json
            ${{ runner.temp }}/image-evidence/*.txt
            ${{ runner.temp }}/image-evidence/*.log
            ${{ runner.temp }}/image-evidence/Dockerfile
            ${{ runner.temp }}/image-evidence/licenses/
            ${{ runner.temp }}/image-evidence/browser/*.png
            ${{ runner.temp }}/image-evidence/browser/result.json
            ${{ runner.temp }}/image-evidence/brand/*.png
            ${{ runner.temp }}/image-evidence/brand/result.json
            ${{ runner.temp }}/image-evidence/brand/cleanup.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  deploy:
    if: github.repository == 'ludafenqi/wuchuang-api' && github.ref == 'refs/heads/codex/wucora-ghcr-verify-stable-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_DIR: ${{ runner.temp }}/stable-deploy
      COMPOSE_PROJECT_NAME: wucora-stable-${{ github.run_id }}
      HEALTH_URL: http://127.0.0.1:39933/api/status
      BACKUP_CONFIRMED: 'YES'
    steps:
      - name: Checkout the exact released deployment script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 1a8604f751cab76c8e2de6918c3e5a4905fce252
          persist-credentials: false
      - name: Exercise stable resolution and rollback on disposable Compose
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BASE_DIR"
          docker version
          cat > "$BASE_DIR/compose.yml" <<'YAML'
          services:
            new-api:
              image: ghcr.io/ludafenqi/wuchuang-api@sha256:eeb5e0124820af2de2a3393b0e42b4dbdaea21d9c260714139974cb57fb23bf7
              ports: ['127.0.0.1:39933:3000']
              tmpfs: ['/data']
              environment:
                UPDATE_TASK: 'false'
                SESSION_SECRET: disposable-compose-review-only
                SQL_DSN: ''
                LOG_SQL_DSN: ''
                REDIS_CONN_STRING: ''
          YAML
          docker compose -f "$BASE_DIR/compose.yml" up -d
          for attempt in $(seq 1 60); do
            if curl -fsS "$HEALTH_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$HEALTH_URL"
          expected='sha256:f0813eeb7858066fff5689355c1fbb4de1794fedc5cbd1f04c5bd49eb508bfa1'
          test "$(docker buildx imagetools inspect ghcr.io/ludafenqi/wuchuang-api:stable --format '{{.Manifest.Digest}}')" = "$expected"
          bash scripts/wuchuang-deploy.sh deploy ghcr.io/ludafenqi/wuchuang-api:stable
          test "$(cat "$BASE_DIR/.wuchuang-release/current-image.txt")" = "ghcr.io/ludafenqi/wuchuang-api@$expected"
          test "$(cat "$BASE_DIR/.wuchuang-release/requested-image.txt")" = ghcr.io/ludafenqi/wuchuang-api:stable
          curl -fsS "$HEALTH_URL" > "$RUNNER_TEMP/deployed-status.json"
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/deployed-status.json")); assert d["data"]["source_revision"]=="1a8604f751cab76c8e2de6918c3e5a4905fce252"'
          bash scripts/wuchuang-deploy.sh rollback
          for attempt in $(seq 1 60); do
            if curl -fsS "$HEALTH_URL" > "$RUNNER_TEMP/rollback-status.json"; then break; fi
            sleep 1
          done
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/rollback-status.json")); assert d["data"]["source_revision"]=="73e91b01a77d12994027b33302411d18cb33f18f"'
          cp "$BASE_DIR/.wuchuang-release/current-image.txt" "$RUNNER_TEMP/current-image.txt"
          cp "$BASE_DIR/.wuchuang-release/requested-image.txt" "$RUNNER_TEMP/requested-image.txt"
      - name: Remove the disposable Compose containers and network
        if: always()
        shell: bash
        run: |
          if [ -f "$BASE_DIR/compose.yml" ]; then
            docker compose -f "$BASE_DIR/compose.yml" down --volumes --remove-orphans
          fi
      - name: Save isolated deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stable-compose-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/deployed-status.json
            ${{ runner.temp }}/rollback-status.json
            ${{ runner.temp }}/current-image.txt
            ${{ runner.temp }}/requested-image.txt
