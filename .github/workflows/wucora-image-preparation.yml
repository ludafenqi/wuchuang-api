name: WuCora image preparation (no publication)
on:
  push:
    branches: [codex/wucora-image-preparation-bf6c9d54-20261107]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wucora-image-preparation-bf6c9d54
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'ludafenqi/wuchuang-api' && github.ref == 'refs/heads/codex/wucora-image-preparation-bf6c9d54-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
      PRODUCT_SHA: bf6c9d540d271bce9ef80764b42dd7c7f6b454df
      IMAGE: wucora-review:sha-bf6c9d540d271bce9ef80764b42dd7c7f6b454df
    steps:
      - name: Checkout verification workflow source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Checkout exact product commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: bf6c9d540d271bce9ef80764b42dd7c7f6b454df
          path: product
          persist-credentials: false
      - name: Record clean source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-evidence"
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git -C product status --porcelain)"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/image-evidence/workflow-sha.txt"
          printf '%s\n' "$PRODUCT_SHA" > "$RUNNER_TEMP/image-evidence/product-sha.txt"
          git -C product rev-parse HEAD^{tree} > "$RUNNER_TEMP/image-evidence/product-tree.txt"
          cp product/Dockerfile product/.dockerignore "$RUNNER_TEMP/image-evidence/"
          docker version > "$RUNNER_TEMP/image-evidence/docker-version.txt"
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build exact integration candidate image locally without pushing
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./product
          file: ./product/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: wucora-review:sha-bf6c9d540d271bce9ef80764b42dd7c7f6b454df
          build-args: |
            SOURCE_REVISION=bf6c9d540d271bce9ef80764b42dd7c7f6b454df
          labels: |
            org.opencontainers.image.source=https://github.com/ludafenqi/wuchuang-api
            org.opencontainers.image.revision=bf6c9d540d271bce9ef80764b42dd7c7f6b454df
      - name: Inspect image, verify licenses and start isolated container
        shell: bash
        run: bash automation/.github/scripts/image-preparation.sh start
      - name: Set up Bun for the external browser harness
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Run real image HTTP and browser validation
        shell: bash
        env:
          UI_BROWSER: /opt/google/chrome/chrome
        run: |
          set -euo pipefail
          cd product/web
          bun install --frozen-lockfile
          bun x playwright install-deps chromium
          cp ../../automation/.github/scripts/container-browser.mjs scripts/container-image-review.mjs
          "$UI_BROWSER" --version | tee "$RUNNER_TEMP/image-evidence/browser-version.txt"
          UI_REPORT_DIR="$RUNNER_TEMP/image-evidence/browser" bun scripts/container-image-review.mjs
          node ../../automation/.github/scripts/image-http.mjs
      - name: Preserve container logs and cleanup
        if: always()
        shell: bash
        run: bash automation/.github/scripts/image-preparation.sh finish
      - name: Upload build and runtime evidence (no registry publication)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-preparation-bf6c9d540d271bce9ef80764b42dd7c7f6b454df-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/image-evidence/*.json
            ${{ runner.temp }}/image-evidence/*.txt
            ${{ runner.temp }}/image-evidence/*.log
            ${{ runner.temp }}/image-evidence/Dockerfile
            ${{ runner.temp }}/image-evidence/.dockerignore
            ${{ runner.temp }}/image-evidence/licenses/
            ${{ runner.temp }}/image-evidence/browser/*.png
            ${{ runner.temp }}/image-evidence/browser/result.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
