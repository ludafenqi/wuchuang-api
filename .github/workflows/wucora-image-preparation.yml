name: WuCora image preparation (no publication)
on:
  push:
    branches: [codex/wucora-image-preparation-9447-20261105]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wucora-image-preparation-9447
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'ludafenqi/wuchuang-api' && github.ref == 'refs/heads/codex/wucora-image-preparation-9447-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRODUCT_SHA: 9447e6fd6934708b9dcc411f1a3bd9dd57ee476e
      IMAGE: wucora-review:sha-9447e6fd6934708b9dcc411f1a3bd9dd57ee476e
    steps:
      - name: Checkout verification workflow source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Checkout exact product commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 9447e6fd6934708b9dcc411f1a3bd9dd57ee476e
          path: product
          persist-credentials: false
      - name: Record clean source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-evidence"
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git -C product status --porcelain)"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/image-evidence/workflow-sha.txt"
          printf '%s\n' "$PRODUCT_SHA" > "$RUNNER_TEMP/image-evidence/product-sha.txt"
          git -C product rev-parse HEAD^{tree} > "$RUNNER_TEMP/image-evidence/product-tree.txt"
          cp product/Dockerfile product/.dockerignore "$RUNNER_TEMP/image-evidence/"
          docker version > "$RUNNER_TEMP/image-evidence/docker-version.txt"
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build exact main image locally without pushing
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./product
          file: ./product/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: wucora-review:sha-9447e6fd6934708b9dcc411f1a3bd9dd57ee476e
          build-args: |
            SOURCE_REVISION=9447e6fd6934708b9dcc411f1a3bd9dd57ee476e
          labels: |
            org.opencontainers.image.source=https://github.com/ludafenqi/wuchuang-api
            org.opencontainers.image.revision=9447e6fd6934708b9dcc411f1a3bd9dd57ee476e
          cache-from: type=gha,scope=wucora-preparation-9447
          cache-to: type=gha,mode=max,scope=wucora-preparation-9447
      - name: Inspect image, verify licenses and start isolated container
        shell: bash
        run: bash automation/.github/scripts/image-preparation.sh start
      - name: Set up Bun for the external browser harness
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Run real image HTTP and browser validation
        shell: bash
        env:
          UI_BROWSER: /opt/google/chrome/chrome
        run: |
          set -euo pipefail
          cd product/web
          bun install --frozen-lockfile
          bun x playwright install-deps chromium
          cp ../../automation/.github/scripts/container-browser.mjs scripts/container-image-review.mjs
          "$UI_BROWSER" --version | tee "$RUNNER_TEMP/image-evidence/browser-version.txt"
          UI_REPORT_DIR="$RUNNER_TEMP/image-evidence/browser" bun scripts/container-image-review.mjs
          node ../../automation/.github/scripts/image-http.mjs
      - name: Archive locally built image
        shell: bash
        run: |
          set -euo pipefail
          docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/image-evidence/image-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP/image-evidence"
          sha256sum image-linux-amd64.tar.gz > image-archive.sha256
      - name: Preserve container logs and cleanup
        if: always()
        shell: bash
        run: bash automation/.github/scripts/image-preparation.sh finish
      - name: Upload build and runtime evidence (no registry publication)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-preparation-9447e6fd6934708b9dcc411f1a3bd9dd57ee476e-${{ github.run_id }}
          path: ${{ runner.temp }}/image-evidence/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
