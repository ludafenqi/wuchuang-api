name: Wuchuang - Daily upstream sync and tests

on:
  schedule:
    # GitHub cron is UTC; this is about 10:17 in China (UTC+8).
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wuchuang-upstream-sync
  cancel-in-progress: false

jobs:
  sync-test-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOWORK: 'off'
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: disposable-review-only
          MYSQL_DATABASE: review
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdisposable-review-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: disposable-review-only
          POSTGRES_DB: review
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d review"
          --health-interval=10s --health-timeout=5s --health-retries=12

    steps:
      - name: Check out fork main without stored credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare a merge candidate, fail closed on conflicts
        id: prepare
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main
          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          echo "upstream=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Fork base: $(git rev-parse origin/main)" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned upstream: $UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only origin/main..."$UPSTREAM_SHA" -- web > upstream-web-changes.txt

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Official main is already included in fork main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git checkout -B automation/upstream-sync origin/main
          if ! git merge --no-ff --no-edit "$UPSTREAM_SHA"; then
            git merge --abort || true
            echo '::error::Merge conflict. Your main branch has not been changed. Resolve the changes manually.'
            exit 1
          fi
          TARGET_SHA="$UPSTREAM_SHA" node -e '
            const fs = require("fs");
            const file = ".github/wucora-ui.json";
            const pin = JSON.parse(fs.readFileSync(file));
            pin.integratedUpstream = process.env.TARGET_SHA;
            fs.writeFileSync(file, JSON.stringify(pin, null, 2) + "\n");
          '
          git add .github/wucora-ui.json
          git diff --cached --quiet || git commit -m 'chore: record pinned upstream candidate'
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "Merged candidate commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # Tests happen BEFORE branch push/PR creation, because GitHub does not
      # trigger ordinary pull_request workflows from a PR opened with GITHUB_TOKEN.
      - name: Set up Go
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Vet, build and test backend
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/dist
          touch web/dist/index.html
          go vet ./...
          go build ./...
          (cd relaykit && go vet ./... && go build ./...)
          (cd tokenkit && go vet ./... && go build ./...)
          make test

      - name: Verify the WuCora footer extension on three real databases
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        env:
          FOOTER_TEST_MYSQL_DSN: 'root:disposable-review-only@tcp(127.0.0.1:3306)/review?parseTime=true'
          FOOTER_TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=postgres password=disposable-review-only dbname=review sslmode=disable'
        run: go test ./model -run 'TestFooter' -count=1 -v

      - name: Set up Bun
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Typecheck, test and build frontend
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run test --maxWorkers=3
          TARGET="${{ steps.prepare.outputs.upstream }}"
          if [ -z "$TARGET" ]; then
            TARGET="$(node -p 'JSON.parse(require("fs").readFileSync("../.github/wucora-ui.json")).integratedUpstream')"
          fi
          UI_QUALITY_DIR="$RUNNER_TEMP/wucora-ui-report/quality" bun scripts/wucora-quality.mjs "$TARGET"
          bun run build

      - name: Verify real gateway pages in desktop/mobile and both themes
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/wucora-ui-gateway" .
          cd web
          bun x playwright install --with-deps chromium
          UI_GATEWAY="$RUNNER_TEMP/wucora-ui-gateway" \
            UI_REPORT_DIR="$RUNNER_TEMP/wucora-ui-report" \
            bun scripts/wucora-browser.mjs

      - name: Preserve screenshots and regression results
        if: always() && (github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wucora-ui-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wucora-ui-report/*.png
            ${{ runner.temp }}/wucora-ui-report/result.json
            ${{ runner.temp }}/wucora-ui-report/quality/
            upstream-web-changes.txt
          if-no-files-found: warn

      - name: Open or refresh review PR after passing tests
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The automation/upstream-sync branch is exclusively managed by this workflow.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin refs/heads/automation/upstream-sync >/dev/null; then
            git fetch origin refs/heads/automation/upstream-sync:refs/remotes/origin/automation/upstream-sync
          fi
          git push --force-with-lease origin HEAD:refs/heads/automation/upstream-sync

          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head automation/upstream-sync --base main --json number \
            --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            cat > "$RUNNER_TEMP/upstream-pr.md" <<EOF
          ## 变更描述
          AI-assisted automated merge of New API upstream commit ${{ steps.prepare.outputs.upstream }} into fork main. WuCora UI reference: b6f0b02864fe13cdd30dd8c443e1af1e53646c5b.

          ## 运行证明
          This run passed Go vet/build/tests in root, relaykit and tokenkit, frontend typecheck/tests/build, lint/format regression against the pinned upstream (full baseline findings remain in the artifact), and the real-gateway browser regression. Review the uploaded screenshots, upstream web changes and any newly added features before approving. Database changes require the real SQLite/MySQL/PostgreSQL matrix; this workflow alone does not certify migrations.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ## 审阅要求
          Keep **Create a merge commit** history; do not squash. Human visual review and release approval remain pending. Merge to main only after all applicable checks pass; reuse the manual GHCR publish workflow and deploy a verified image digest after backup and recovery review.
          EOF
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main --head automation/upstream-sync \
              --draft \
              --title 'chore: review New API upstream updates' \
              --body-file "$RUNNER_TEMP/upstream-pr.md"
          else
            echo "Updated existing PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          fi
