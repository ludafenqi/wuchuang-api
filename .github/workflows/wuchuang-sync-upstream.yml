name: Wuchuang - Daily upstream sync and tests

on:
  schedule:
    # GitHub cron is UTC; this is about 10:17 in China (UTC+8).
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Optional full upstream SHA; scheduled runs use upstream/main'
        required: false
        type: string
      resolved_candidate:
        description: 'Optional full fork commit SHA containing an explicitly resolved merge'
        required: false
        type: string
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wuchuang-upstream-sync
  cancel-in-progress: false

jobs:
  sync-test-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOWORK: 'off'
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: disposable-review-only
          MYSQL_DATABASE: review
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdisposable-review-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: disposable-review-only
          POSTGRES_DB: review
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d review"
          --health-interval=10s --health-timeout=5s --health-retries=12

    steps:
      - name: Check out fork main without stored credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun for conflict verification
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'

      - name: Test upstream review PR creation and refresh
        run: node --test .github/scripts/upstream-review.test.mjs .github/scripts/merge-upstream-locales.test.mjs

      - name: Prepare a merge candidate, fail closed on conflicts
        id: prepare
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          REQUESTED_UPSTREAM: ${{ inputs.upstream_sha }}
          RESOLVED_CANDIDATE: ${{ inputs.resolved_candidate }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The selected workflow ref supplies the driver, while the product
          # starts at main. This permits testing a driver repair before merging it.
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/prepare-upstream-candidate.mjs" > "$RUNNER_TEMP/prepare-upstream-candidate.mjs"
          git show "$GITHUB_SHA:.github/scripts/merge-upstream-locales.mjs" > "$RUNNER_TEMP/merge-upstream-locales.mjs"
          node "$RUNNER_TEMP/prepare-upstream-candidate.mjs"

      - name: Verify candidate preparation and normalized translations
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test .github/scripts/prepare-upstream-candidate.test.mjs
          (cd web && bun run i18n:sync)
          git diff --exit-code -- web/src/i18n/locales

      # Validate BEFORE pushing: GITHUB_TOKEN pull_request opened/synchronize/
      # reopened runs require approval; they are not automatically running checks.
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
      - name: Set up Go
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Vet, build and test backend
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/dist
          touch web/dist/index.html
          go vet ./...
          go build ./...
          (cd relaykit && go vet ./... && go build ./...)
          (cd tokenkit && go vet ./... && go build ./...)
          make test

      - name: Verify footer and stored plugin pricing on three real databases
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        env:
          FOOTER_TEST_MYSQL_DSN: 'root:disposable-review-only@tcp(127.0.0.1:3306)/review?parseTime=true'
          FOOTER_TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=postgres password=disposable-review-only dbname=review sslmode=disable'
          TEST_MYSQL_DSN: 'root:disposable-review-only@tcp(127.0.0.1:3306)/review?parseTime=true'
          TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=postgres password=disposable-review-only dbname=review sslmode=disable'
          TEST_AUTH_REDIS_ADDR: '127.0.0.1:6379'
          PRICING_TEST_MYSQL_DSN: 'root:disposable-review-only@tcp(127.0.0.1:3306)/review?parseTime=true'
          PRICING_TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=postgres password=disposable-review-only dbname=review sslmode=disable'
        run: go test ./model -run 'TestFooter|^Test(AuthCacheIntegrityDatabaseMatrix|ModelPricingIssuesDatabaseMatrix)$' -count=1 -v

      - name: Verify auth cache operations on a real six-node Redis Cluster
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        run: bash .github/scripts/verify-redis-cluster.sh

      - name: Verify Vertex token caching under the race detector
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        run: go test -race ./relay/channel/vertex -run '^TestGetAccessToken|^TestExchangeJwt' -count=1 -timeout=120s

      - name: Verify channel creation and rollback on three real databases
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for dsn in '' 'root:disposable-review-only@tcp(127.0.0.1:3306)/review?parseTime=true' 'postgres://postgres:disposable-review-only@127.0.0.1:5432/review?sslmode=disable'; do
            TEST_CHANNEL_SQL_DSN="$dsn" go test ./controller -run '^TestAddChannel(ReturnsCreatedIDs|InvalidVertexBatchDoesNotReturnResults|RollbackDoesNotReturnIDs|PanicRollsBackWithoutSuccess)$|^TestMultiKeyEnableRestoresOnlyExhaustedChannels$' -count=1 -v
          done

      - name: Verify OAuth inviter persistence on three real databases
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for dsn in '' 'root:disposable-review-only@tcp(127.0.0.1:3306)/review?parseTime=true' 'postgres://postgres:disposable-review-only@127.0.0.1:5432/review?sslmode=disable'; do
            TEST_TASK_SQL_DSN="$dsn" go test ./controller -run '^TestOAuthRegistrationPersistsInviter$' -count=1 -v
          done

      - name: Verify delivered SSE settlement despite failures on three real databases
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -pdisposable-review-only -e 'CREATE DATABASE review_tasks;'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -c 'CREATE DATABASE review_tasks;'
          for dsn in '' 'root:disposable-review-only@tcp(127.0.0.1:3306)/review_tasks?parseTime=true' 'postgres://postgres:disposable-review-only@127.0.0.1:5432/review_tasks?sslmode=disable'; do
            TEST_TASK_SQL_DSN="$dsn" go test ./controller -run '^TestDoubaoRelayedImageStreamSettlement$' -count=1 -v
          done

      - name: Set up Bun
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Typecheck, test and build frontend
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run test --maxWorkers=3
          TARGET="${{ steps.prepare.outputs.upstream }}"
          if [ -z "$TARGET" ]; then
            TARGET="$(node -p 'JSON.parse(require("fs").readFileSync("../.github/wucora-ui.json")).integratedUpstream')"
          fi
          UI_QUALITY_DIR="$RUNNER_TEMP/wucora-ui-report/quality" bun scripts/wucora-quality.mjs "$TARGET"
          bun run build

      - name: Verify real gateway pages in desktop/mobile and both themes
        if: github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true'
        shell: bash
        env:
          UI_BROWSER: /opt/google/chrome/chrome
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/wucora-ui-gateway" .
          cd web
          # Use the runner's AppArmor-allowed Chrome with its sandbox enabled.
          "$UI_BROWSER" --version
          bun x playwright install-deps chromium
          UI_GATEWAY="$RUNNER_TEMP/wucora-ui-gateway" \
            UI_REPORT_DIR="$RUNNER_TEMP/wucora-ui-report" \
            bun scripts/wucora-browser.mjs

      - name: Preserve screenshots and regression results
        if: always() && (github.event_name == 'pull_request' || steps.prepare.outputs.changed == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wucora-ui-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wucora-ui-report/*.png
            ${{ runner.temp }}/wucora-ui-report/result.json
            ${{ runner.temp }}/wucora-ui-report/quality/
            upstream-web-changes.txt
          if-no-files-found: warn

      - name: Open or refresh review PR after passing tests
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.prepare.outputs.upstream }}
        shell: bash
        run: |
          set -euo pipefail
          # The automation/upstream-sync branch is exclusively managed by this workflow.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin refs/heads/automation/upstream-sync >/dev/null; then
            git fetch origin refs/heads/automation/upstream-sync:refs/remotes/origin/automation/upstream-sync
          fi
          node .github/scripts/upstream-review.mjs
