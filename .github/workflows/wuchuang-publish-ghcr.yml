name: Wuchuang - Publish GHCR manually

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wuchuang-manual-publish
  cancel-in-progress: false

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOWORK: 'off'
      IMAGE: ghcr.io/ludafenqi/wuchuang-api

    steps:
      - name: Require manual run from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Only main can be published. Review and merge your PR first.'
            exit 1
          fi

      - name: Checkout selected main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a stale main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo '::error::main moved while this run started. Start a new manual publish.'
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Vet, build and test backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/dist
          touch web/dist/index.html
          go vet ./...
          go build ./...
          (cd relaykit && go vet ./... && go build ./...)
          (cd tokenkit && go vet ./... && go build ./...)
          make test

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Typecheck, test and build frontend
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ludafenqi/wuchuang-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ludafenqi/wuchuang-api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Display release image (pin by digest)
        env:
          DIGEST: ${{ steps.image_build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          echo '## Wuchuang manual release ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Copy the immutable digest reference below to deploy the VPS manually:' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Publishing to GHCR does NOT update the VPS automatically.' >> "$GITHUB_STEP_SUMMARY"
