
name: Sync upstream New API

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream \
            https://github.com/QuantumNous/new-api.git
          git fetch origin main
          git fetch upstream main

      - name: Check for upstream updates
        id: check
        shell: bash
        run: |
          if git merge-base --is-ancestor \
            upstream/main HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream is already included."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changes detected."
          fi

      - name: Create backup branch
        if: steps.check.outputs.needed == 'true'
        id: backup
        shell: bash
        run: |
          BACKUP="backup/pre-sync-$(date -u +%Y%m%d-%H%M%S)"
          git branch "$BACKUP" HEAD
          git push origin "$BACKUP"
          echo "branch=$BACKUP" >> "$GITHUB_OUTPUT"

      - name: Merge upstream without overwriting local changes
        if: steps.check.outputs.needed == 'true'
        shell: bash
        run: |
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Merge conflict or merge failure."
            echo "Backup branch: ${{ steps.backup.outputs.branch }}"
            exit 1
          fi

      - name: Push synchronized code
        if: steps.check.outputs.needed == 'true'
        run: |
          git push origin HEAD:refs/heads/main

      - name: Report result
        if: always()
        run: |
          echo "Workflow completed with status: ${{ job.status }}"
