name: CI

on:
  # This review branch can run Linux checks without opening a PR or publishing.
  push:
    branches: [codex/wucora-maintained-ui]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout the event commit in both jobs. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: disposable-review-only
          MYSQL_DATABASE: review
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdisposable-review-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: disposable-review-only
          POSTGRES_DB: review
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d review"
          --health-interval=10s --health-timeout=5s --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Bun for conflict verification
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'

      - name: Test upstream review PR creation and refresh
        run: node --test .github/scripts/upstream-review.test.mjs .github/scripts/merge-upstream-locales.test.mjs .github/scripts/prepare-upstream-candidate.test.mjs

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

      - name: Verify auth, MFA, footer and pricing on three real databases
        env:
          TEST_MYSQL_DSN: 'root:disposable-review-only@tcp(127.0.0.1:3306)/review?parseTime=true'
          TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=postgres password=disposable-review-only dbname=review sslmode=disable'
          TEST_AUTH_REDIS_ADDR: '127.0.0.1:6379'
          FOOTER_TEST_MYSQL_DSN: 'root:disposable-review-only@tcp(127.0.0.1:3306)/review?parseTime=true'
          FOOTER_TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=postgres password=disposable-review-only dbname=review sslmode=disable'
          PRICING_TEST_MYSQL_DSN: 'root:disposable-review-only@tcp(127.0.0.1:3306)/review?parseTime=true'
          PRICING_TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=postgres password=disposable-review-only dbname=review sslmode=disable'
        run: go test ./model -run 'TestFooter|^Test(AuthCacheIntegrityDatabaseMatrix|ModelPricingIssuesDatabaseMatrix)$' -count=1 -v

      - name: Verify auth cache operations on a real six-node Redis Cluster
        run: bash .github/scripts/verify-redis-cluster.sh

      - name: Verify atomic subscription refunds on three real databases
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -pdisposable-review-only -e 'CREATE DATABASE review_refunds;'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -c 'CREATE DATABASE review_refunds;'
          for dsn in '' 'root:disposable-review-only@tcp(127.0.0.1:3306)/review_refunds?parseTime=true' 'postgres://postgres:disposable-review-only@127.0.0.1:5432/review_refunds?sslmode=disable'; do
            SUBSCRIPTION_TEST_SQL_DSN="$dsn" go test ./model -run '^TestSubscriptionRefund|^TestSubscriptionDeltaValidation' -count=1 -v
          done

      - name: Verify billing settlement with independent logs on three real databases
        env:
          TEST_FIXED_MYSQL_DSN: 'root:disposable-review-only@tcp(127.0.0.1:3306)/review_billing?parseTime=true'
          TEST_FIXED_MYSQL_LOG_DSN: 'root:disposable-review-only@tcp(127.0.0.1:3306)/review_billing_logs?parseTime=true'
          TEST_FIXED_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=postgres password=disposable-review-only dbname=review_billing sslmode=disable'
          TEST_FIXED_POSTGRES_LOG_DSN: 'host=127.0.0.1 port=5432 user=postgres password=disposable-review-only dbname=review_billing_logs sslmode=disable'
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -pdisposable-review-only -e 'CREATE DATABASE review_billing; CREATE DATABASE review_billing_logs;'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -c 'CREATE DATABASE review_billing;'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -c 'CREATE DATABASE review_billing_logs;'
          go test ./service -run '^TestFixedPriceBillingDatabaseMatrix$|^TestSweepTimedOutTasksAtTheDefaultDeadline$' -count=1 -v

      - name: Verify relay failure accounting with independent logs on three real databases
        shell: bash
        run: |
          set -euo pipefail
          for dsn in '' 'root:disposable-review-only@tcp(127.0.0.1:3306)/review?parseTime=true' 'postgres://postgres:disposable-review-only@127.0.0.1:5432/review?sslmode=disable'; do
            TEST_RELAY_PANIC_SQL_DSN="$dsn" go test ./controller -run '^Test(RelayPanicPreservesAccounting|RelayStreamPanicPreservesUsageSettlement|StreamPanicDoesNotAddRefundAfterAccountingAttempt|RealtimePanicPreservesActualAccounting|KeepAlivePanicPreservesReservationBoundary)$' -count=1 -timeout=180s -v
          done

      - name: Verify stream concurrency under the race detector
        run: go test -race ./controller ./relay/helper ./relay/channel/openai -run '^Test(RealtimeReadersPropagateFailureAndJoin|RealtimePanicPreservesActualAccounting|StreamScannerPanicSafety|StreamScannerPanicIO|KeepAlivePanicStopsUpstream|KeepAlivePanicCancelsInflightRequest)$' -count=1 -timeout=180s

      - name: Verify channel creation and rollback on three real databases
        shell: bash
        run: |
          set -euo pipefail
          for dsn in '' 'root:disposable-review-only@tcp(127.0.0.1:3306)/review?parseTime=true' 'postgres://postgres:disposable-review-only@127.0.0.1:5432/review?sslmode=disable'; do
            TEST_CHANNEL_SQL_DSN="$dsn" go test ./controller -run '^TestAddChannel(ReturnsCreatedIDs|InvalidVertexBatchDoesNotReturnResults|RollbackDoesNotReturnIDs|PanicRollsBackWithoutSuccess)$' -count=1 -v
          done

      - name: Verify delivered SSE settlement despite failures on three real databases
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -pdisposable-review-only -e 'CREATE DATABASE review_tasks;'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -c 'CREATE DATABASE review_tasks;'
          for dsn in '' 'root:disposable-review-only@tcp(127.0.0.1:3306)/review_tasks?parseTime=true' 'postgres://postgres:disposable-review-only@127.0.0.1:5432/review_tasks?sslmode=disable'; do
            TEST_TASK_SQL_DSN="$dsn" go test ./controller -run '^TestDoubaoRelayedImageStreamSettlement$' -count=1 -v
          done

  frontend:
    name: Frontend and real-gateway UI regression
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun check -b

      - name: Test
        run: bun run test

      - name: Check UI quality against the pinned upstream and build
        run: |
          set -euo pipefail
          TARGET="$(node -p 'JSON.parse(require("fs").readFileSync("../.github/wucora-ui.json")).integratedUpstream')"
          UI_QUALITY_DIR="$RUNNER_TEMP/wucora-review/quality" bun scripts/wucora-quality.mjs "$TARGET"
          bun run build

      - name: Set up Go for the disposable UI gateway
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Verify real gateway pages without publishing
        working-directory: .
        env:
          GOWORK: 'off'
          UI_BROWSER: /opt/google/chrome/chrome
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/wucora-review-gateway" .
          cd web
          # Ubuntu's packaged Chrome has the AppArmor user-namespace allowance.
          # Keep chromiumSandbox enabled; never change runner-wide restrictions.
          "$UI_BROWSER" --version
          bun x playwright install-deps chromium
          UI_GATEWAY="$RUNNER_TEMP/wucora-review-gateway" UI_REPORT_DIR="$RUNNER_TEMP/wucora-review" bun scripts/wucora-browser.mjs

      - name: Preserve UI review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wucora-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wucora-review/*.png
            ${{ runner.temp }}/wucora-review/result.json
            ${{ runner.temp }}/wucora-review/quality/
          if-no-files-found: warn
